# go-homeconnect2mqtt — daemon configuration template.
# Copy to config.yaml and adjust. Every key can also be overridden via an
# environment variable with the HC2M_ prefix (e.g. HC2M_MQTT_SERVER=...).

# --- MQTT ---
MQTT_SERVER: "tcp://localhost:1883"
MQTT_LOGIN: ""
MQTT_PASSWORD: ""
# MQTT_CA is the path to a PEM file with the CA certificate(s) that signed
# the broker's TLS certificate. Empty uses the system trust store. Only used
# with a tls://, ssl:// or mqtts:// MQTT_SERVER.
MQTT_CA: ""
# MQTT_TOPIC is the instance name: every topic is <MQTT_TOPIC>/<function>/...
# (mqtt-smarthome 2.0). It is the ONLY thing that keeps two instances on one
# broker apart — give each its own. The default "homeconnect" is also the
# default instance name of hobbyquaker's Node.js adapter homeconnect2mqtt;
# running both on one broker needs one of them renamed. One topic level:
# no "/", "+" or "#".
MQTT_TOPIC: "homeconnect"
# QoS of the discovery documents, <MQTT_TOPIC>/connected and the Last Will.
# Status items are always QoS 0 and retained, `set` is subscribed at QoS 1.
MQTT_QOS: 1
# Maintenance topics (<MQTT_TOPIC>/maintenance/...): runtime log level,
# restart under a supervisor, process stats. Anyone who may publish on the
# broker can use them — secure the broker with ACLs or switch this off.
MQTT_MAINTENANCE: true
MQTT_STATS_INTERVAL: 60  # seconds between <MQTT_TOPIC>/maintenance/stats; 0 = off

# --- Home Assistant discovery ---
HASS_ENABLE: true
HASS_BASE_TOPIC: "homeassistant"
HASS_BIRTH_GRACETIME: 15
HASS_DISCOVERY: "full"  # full = expose every feature (long tail disabled by default); curated = primary set only

# --- Connection / resilience ---
APP_NAME: "go-homeconnect2mqtt"
APP_ID: ""              # free-form; empty -> generated random hex id
RECONNECT_INITIAL: 1    # seconds
RECONNECT_MAX: 30       # seconds
RECONNECT_JITTER: 500   # milliseconds
HANDSHAKE_TIMEOUT: 60   # seconds
SEND_TIMEOUT: 20        # seconds
HEARTBEAT: 20           # seconds

# --- Web UI (optional, opt-in) ---
WEB_ENABLE: false
WEB_BIND: "127.0.0.1:8080"
WEB_USER: ""
WEB_PASSWORD: ""

# --- Misc ---
LANGUAGE: "de"          # de | en
DEBUG: false
