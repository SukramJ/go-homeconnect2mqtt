name: "Release: Create from Tag"
# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "**"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  create_release:
    if: github.repository_owner == 'SukramJ'
    name: Create GitHub Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version from tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # The release body is the changelog section for this tag, so an
      # operator reading the release sees what changed and what it costs
      # them, not a list of commit subjects. GitHub rejects a release body
      # over 125,000 characters with a 422 — and by then the tag is already
      # on the remote — so the section is trimmed to fit, leaving headroom
      # for the auto-generated commit notes appended below it.
      - name: Extract release notes from changelog.md
        env:
          BODY_LIMIT: "118000"
        run: |
          set -euo pipefail
          awk -v v="## [${VERSION}] - " '
            index($0, v) == 1 { f = 1; next }
            f && /^## \[/      { exit }
            f                  { print }
          ' changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::changelog.md has no '## [${VERSION}] - <date>' section"
            exit 1
          fi
          size=$(wc -c < release-notes.md)
          echo "changelog section: ${size} bytes (GitHub caps a release body at 125000)"
          if [ "${size}" -gt "${BODY_LIMIT}" ]; then
            echo "::warning::trimming the release body from ${size} to ${BODY_LIMIT} bytes"
            head -c "${BODY_LIMIT}" release-notes.md > release-notes.trimmed
            printf '\n\n---\n\n_Truncated to fit GitHub'"'"'s release-body limit. The full entry is in [changelog.md](%s)._\n' \
              "https://github.com/${GITHUB_REPOSITORY}/blob/${TAG_NAME}/changelog.md" \
              >> release-notes.trimmed
            mv release-notes.trimmed release-notes.md
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # `make release` cross-compiles the matrix, bundles each target with
      # the YAML assets + docs and writes dist/SHA256SUMS.
      - name: Build release archives
        run: make release RELEASE_VERSION="${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release-notes.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
